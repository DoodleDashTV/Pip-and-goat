# Registration touch; preflight is read-only against RunPod and cannot create a pod.
name: TivvleJoy Scenery Showcase Bridge Preflight V4

on:
  push:
    branches:
      - cursor/tivvlejoy-scenery-showcase-30s-v1-73f1
    paths:
      - '.github/workflows/tivvlejoy-scenery-showcase-bridge-preflight-v4.yml'

permissions:
  contents: read

concurrency:
  group: tivvlejoy-scenery-showcase-bridge-preflight-v4
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRIDGE_URL: https://pip-and-goat-git-cursor-tivvlejoy-a91ad2-doodledashtvs-projects.vercel.app/api/scenery/showcase-30s-v4
      AUTH: TIVVLEJOY_SCENERY_SHOWCASE_30S_PAID_EXECUTION_AUTHORIZATION_V4
      EXPECTED_TEMPLATE_ID: nasqriytzc
      EXPECTED_IMAGE: ghcr.io/doodledashtv/ddp-runpod-blender@sha256:1bef7ad588e74f6a59ef1a8e0ebcebc67cb94e75868d930a57fa8f07d30f44a6
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Verify V4 bridge without paid mutation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNPOD_API_KEY"
          code=$(curl --retry 8 --retry-all-errors --retry-delay 3 --max-time 90 -sS -o preflight.json -w '%{http_code}' \
            --request POST "$BRIDGE_URL" \
            --header 'content-type: application/json' \
            --header "x-tivvlejoy-scenery-authorization: $AUTH" \
            --header "x-tivvlejoy-runpod-key: $RUNPOD_API_KEY" \
            --data '{"action":"preflight"}')
          cat preflight.json
          test "$code" = '200'
          python3 - <<'PY'
          import json, os
          p=json.load(open('preflight.json'))
          assert p.get('schema') == 'TIVVLEJOY_SCENERY_SHOWCASE_30S_PREFLIGHT_V6'
          assert p.get('ready') is True
          assert p.get('paidMutationPerformed') is False
          assert p.get('workerImage') == os.environ['EXPECTED_IMAGE']
          assert p.get('workerImagePinned') is True
          assert p.get('launchTransport') == 'RUNPOD_REST_TEMPLATE'
          assert p.get('runtimeDockerArgsRequired') is False
          assert int(p.get('requiredRoleCount')) == 10
          assert p.get('natureLibraryRequired') is False
          assert p.get('waterSystemRequired') is False
          assert int(p.get('activePodCount')) == 0
          a=p.get('assets') or {}
          assert a.get('ready') is True
          assert int(a.get('requiredRoleCount')) == 10
          assert int(a.get('selectedRoleCount')) == 10
          assert a.get('purchasedSceneryOnly') is True
          total=int(a.get('selectedTotalBytes'))
          cap=int(a.get('hardInputCapBytes'))
          assert 0 < total <= cap
          assert cap == 5*1024*1024*1024
          t=p.get('template') or {}
          assert t.get('templateId') == os.environ['EXPECTED_TEMPLATE_ID']
          assert t.get('imageName') == os.environ['EXPECTED_IMAGE']
          rate=float((p.get('runpod') or {}).get('rate'))
          assert 0 < rate <= 0.8
          limits=p.get('limits') or {}
          assert int(limits.get('maxCreates')) == 1
          assert float(limits.get('hardCostUsd')) == 2.0
          assert float(limits.get('maxHourlyUsd')) == 0.8
          safe={'ready':True,'templateId':t.get('templateId'),'workerImage':p.get('workerImage'),'requiredRoleCount':10,'selectedTotalBytes':total,'hardInputCapBytes':cap,'secureUsdPerHr':rate,'stockStatus':(p.get('runpod') or {}).get('stockStatus'),'activePodCount':0,'paidMutationPerformed':False}
          print(json.dumps(safe))
          open('preflight-v4-safe.json','w').write(json.dumps(safe,indent=2)+'\n')
          PY
      - name: Upload sanitized V4 preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: tivvlejoy-scenery-showcase-bridge-preflight-v4
          path: preflight-v4-safe.json
          if-no-files-found: error
          retention-days: 14
