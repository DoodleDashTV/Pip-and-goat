name: TivvleJoy Real Scenery 30s Paid Render

on:
  push:
    branches:
      - cursor/tivvlejoy-scenery-showcase-30s-v1-73f1
    paths:
      - '.github/workflows/tivvlejoy-scenery-showcase-paid-render.yml'

permissions:
  contents: read

concurrency:
  group: tivvlejoy-real-scenery-30s-paid-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      BRIDGE_URL: https://pip-and-goat-git-cursor-tivvlejoy-a91ad2-doodledashtvs-projects.vercel.app/api/scenery/showcase-30s
      CLEANUP_URL: https://pip-and-goat-git-cursor-tivvlejoy-a91ad2-doodledashtvs-projects.vercel.app/api/scenery/showcase-30s/cleanup
      SCENERY_AUTHORIZATION: TIVVLEJOY_SCENERY_SHOWCASE_30S_PAID_EXECUTION_AUTHORIZATION_V1
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: One authorized CREATE
        id: launch
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNPOD_API_KEY"
          code=$(curl -sS -o launch.json -w '%{http_code}' \
            --request POST "$BRIDGE_URL" \
            --header 'content-type: application/json' \
            --header "x-tivvlejoy-scenery-authorization: $SCENERY_AUTHORIZATION" \
            --header "x-tivvlejoy-runpod-key: $RUNPOD_API_KEY" \
            --data '{"action":"launch"}')
          python3 - <<'PY'
          import json
          p=json.load(open('launch.json'))
          safe={
            'schema':p.get('schema'),
            'executionId':p.get('executionId'),
            'createEntered':p.get('createEntered'),
            'createRequests':p.get('createRequests'),
            'retryCreate':p.get('retryCreate'),
            'runpod':p.get('runpod'),
            'workerEntrypoint':p.get('workerEntrypoint'),
            'dryShowcase':p.get('dryShowcase'),
            'limits':p.get('limits'),
            'error':p.get('error'),
          }
          print(json.dumps(safe))
          PY
          test "$code" = '200'
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('launch.json'))
          assert p.get('createEntered') is True
          assert p.get('createRequests') == 1
          assert p.get('retryCreate') is False
          assert p.get('workerEntrypoint') == 'scenery-showcase.js'
          pod=p.get('podId')
          assert pod
          print('pod_id='+pod)
          PY

      - name: Poll verified R2 render status
        shell: bash
        run: |
          set -euo pipefail
          terminal=''
          for i in $(seq 1 420); do
            curl -sS "$BRIDGE_URL" -o status.json
            read -r state startup <<<"$(python3 - <<'PY'
          import json
          p=json.load(open('status.json'))
          status=p.get('status') or {}
          startup=p.get('startup') or {}
          print(str(status.get('status') or 'NONE'), 'YES' if startup else 'NO')
          PY
          )"
            if [ "$state" = 'COMPLETE' ]; then
              terminal='COMPLETE'
              break
            fi
            if [ "$state" = 'FAILED' ]; then
              python3 - <<'PY'
          import json
          p=json.load(open('status.json'))
          s=p.get('status') or {}
          print('Worker failed:', s.get('code'), s.get('message'))
          PY
              exit 1
            fi
            if [ "$i" -ge 60 ] && [ "$startup" = 'NO' ]; then
              echo 'Startup watchdog: no R2 startup status after 15 minutes.'
              exit 1
            fi
            sleep 15
          done
          test "$terminal" = 'COMPLETE'
          python3 - <<'PY'
          import json
          p=json.load(open('status.json'))
          s=p.get('status') or {}
          assert s.get('status') == 'COMPLETE'
          assert s.get('resolution') == '1080x1920'
          assert int(s.get('fps')) == 30
          assert int(s.get('frameCount')) >= 900
          assert abs(float(s.get('durationSeconds')) - 30.0) <= 0.1
          assert s.get('artifactSha256') == s.get('readbackSha256')
          assert s.get('commercialAssetsPublished') is False
          print(json.dumps({
            'status':s.get('status'),
            'frameCount':s.get('frameCount'),
            'resolution':s.get('resolution'),
            'fps':s.get('fps'),
            'durationSeconds':s.get('durationSeconds'),
            'selectedRoleCount':s.get('selectedRoleCount'),
            'artifactSha256':s.get('artifactSha256'),
            'commercialAssetsPublished':s.get('commercialAssetsPublished'),
          }))
          PY

      - name: Download verified MP4
        shell: bash
        run: |
          set -euo pipefail
          curl -sS "$BRIDGE_URL?download=1" -o download.json
          python3 - <<'PY' > download-url.txt
          import json
          p=json.load(open('download.json'))
          assert (p.get('status') or {}).get('status') == 'COMPLETE'
          u=p.get('downloadUrl')
          assert u
          print(u)
          PY
          curl -sS --fail "$(cat download-url.txt)" -o tivvlejoy-scenery-showcase-30s.mp4
          ffprobe -v error -of json -show_streams -show_format tivvlejoy-scenery-showcase-30s.mp4 > ffprobe.json
          python3 - <<'PY'
          import json, os
          p=json.load(open('ffprobe.json'))
          v=next(s for s in p['streams'] if s.get('codec_type')=='video')
          assert int(v['width']) == 1080
          assert int(v['height']) == 1920
          d=float(p['format']['duration'])
          assert 29.8 <= d <= 30.2, d
          size=os.path.getsize('tivvlejoy-scenery-showcase-30s.mp4')
          assert size > 100000
          print(json.dumps({'width':1080,'height':1920,'duration':d,'bytes':size}))
          PY

      - name: Upload finished scenery video
        uses: actions/upload-artifact@v4
        with:
          name: tivvlejoy-scenery-showcase-30s-real-assets
          path: |
            tivvlejoy-scenery-showcase-30s.mp4
            status.json
            ffprobe.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Always terminate exact showcase pod
        if: always()
        shell: bash
        run: |
          set +e
          code=$(curl -sS -o cleanup.json -w '%{http_code}' \
            --request POST "$CLEANUP_URL" \
            --header 'content-type: application/json' \
            --header "x-tivvlejoy-scenery-authorization: $SCENERY_AUTHORIZATION" \
            --header "x-tivvlejoy-runpod-key: $RUNPOD_API_KEY" \
            --data '{}')
          python3 - <<'PY'
          import json
          try:
            p=json.load(open('cleanup.json'))
          except Exception:
            p={}
          print(json.dumps({
            'matchedBefore':p.get('matchedBefore'),
            'terminatedCount':p.get('terminatedCount'),
            'remainingActiveExactName':p.get('remainingActiveExactName'),
            'billingCleanupConfirmed':p.get('billingCleanupConfirmed'),
            'error':p.get('error'),
          }))
          if p.get('billingCleanupConfirmed') is not True:
            raise SystemExit(1)
          PY
          test "$code" = '200'
