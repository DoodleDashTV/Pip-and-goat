name: TivvleJoy Real Scenery Original14 Paid Render V1

on:
  push:
    branches:
      - cursor/tivvlejoy-scenery-showcase-30s-v1-73f1
    paths:
      - 'artifacts/tivvlejoy-scenery-showcase-30s/PAID_AUTHORIZATION_ORIGINAL14_V1.json'

permissions:
  contents: read

concurrency:
  group: tivvlejoy-real-scenery-original14-paid-render-v1
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      BRIDGE_URL: https://pip-and-goat-git-cursor-tivvlejoy-a91ad2-doodledashtvs-projects.vercel.app/api/scenery/showcase-30s-original14-v1 # pragma: allowlist secret
      SCENERY_AUTHORIZATION: TIVVLEJOY_SCENERY_ORIGINAL14_30S_STANDING_AUTHORIZATION_V1
      EXPECTED_TEMPLATE_ID: u4glgdj076
      EXPECTED_IMAGE: ghcr.io/<ghcr-owner>/ddp-runpod-blender@sha256:32f718745ae7260f15ed4c500ebeab90e4f96aa276131bb4c996313ca9b045c1
      EXPECTED_IMAGE_DIGEST: sha256:32f718745ae7260f15ed4c500ebeab90e4f96aa276131bb4c996313ca9b045c1
      EXPECTED_EXECUTION_ID: scenery-showcase-original14-30s-v1-20260828
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Checkout exact standing-authorization commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate standing authorization and exact render contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          p=json.load(open('artifacts/tivvlejoy-scenery-showcase-30s/PAID_AUTHORIZATION_ORIGINAL14_V1.json'))
          assert p.get('schema') == 'TIVVLEJOY_SCENERY_ORIGINAL14_30S_STANDING_AUTHORIZATION_V1'
          assert p.get('authorized') is True
          assert p.get('executionId') == os.environ['EXPECTED_EXECUTION_ID']
          assert p.get('templateId') == os.environ['EXPECTED_TEMPLATE_ID']
          assert p.get('workerImage') == os.environ['EXPECTED_IMAGE']
          assert p.get('workerImageDigest') == os.environ['EXPECTED_IMAGE_DIGEST']
          assert int(p.get('maxCreates')) == 1
          assert p.get('noBlindRetry') is True
          assert p.get('secureGpuOnly') == 'NVIDIA GeForce RTX 4090'
          assert float(p.get('maxHourlyUsd')) == 0.8
          assert float(p.get('hardCostUsd')) == 2.0
          assert int(p.get('maxRuntimeMinutes')) == 75
          assert int(p.get('startupWatchdogMinutes')) == 25
          assert int(p.get('originalSourceCount')) == 14
          assert int(p.get('renderableSourceCount')) == 11
          assert int(p.get('unityPreservationOnlyCount')) == 3
          assert int(p.get('collectionCount')) == 4
          assert p.get('internalResolution') == '540x960'
          assert p.get('finalResolution') == '1080x1920'
          assert int(p.get('fps')) == 30
          assert int(p.get('frameCount')) == 900
          assert int(p.get('samples')) == 12
          assert p.get('purchasedSceneryOnly') is True
          assert p.get('commercialAssetsPublished') is False
          print('Original14 standing authorization contract PASS')
          PY

      - name: Zero-cost preflight immediately before one paid CREATE
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNPOD_API_KEY"
          code=$(curl --retry 8 --retry-all-errors --retry-delay 3 --max-time 90 -sS -o preflight.json -w '%{http_code}' \
            --request POST "$BRIDGE_URL" \
            --header 'content-type: application/json' \
            --header "x-tivvlejoy-scenery-authorization: $SCENERY_AUTHORIZATION" \
            --header "x-tivvlejoy-runpod-key: $RUNPOD_API_KEY" \
            --data '{"action":"preflight"}')
          test "$code" = '200'
          python3 - <<'PY'
          import json, os
          p=json.load(open('preflight.json'))
          assert p.get('schema') == 'TIVVLEJOY_SCENERY_ORIGINAL14_30S_PREFLIGHT_V1'
          assert p.get('ready') is True and p.get('paidMutationPerformed') is False
          digest=os.environ['EXPECTED_IMAGE_DIGEST']
          assert str(p.get('workerImage') or '').endswith(digest) and p.get('workerImagePinned') is True
          assert p.get('workerImageDigest') == digest
          assert p.get('workerEntrypoint') == 'scenery-showcase-original14-entry.js'
          assert p.get('launchTransport') == 'RUNPOD_REST_TEMPLATE'
          assert int(p.get('activePodCount')) == 0
          assert int(p.get('originalSourceCount')) == 14
          assert int(p.get('renderableSourceCount')) == 11
          assert int(p.get('unityPreservationOnlyCount')) == 3
          assert int(p.get('collectionCount')) == 4
          assert p.get('internalResolution') == '540x960'
          assert p.get('finalResolution') == '1080x1920'
          assert int(p.get('samples')) == 12
          a=p.get('assets') or {}
          assert a.get('ready') is True and int(a.get('expectedSourceCount')) == 14 and int(a.get('selectedSourceCount')) == 14
          assert not (a.get('missingSourceIds') or [])
          assert int(a.get('totalOriginalBytes')) == 3002049687
          assert a.get('commercialAssetsPublished') is False and a.get('privateObjectKeysPublished') is False
          t=p.get('template') or {}
          assert t.get('templateId') == os.environ['EXPECTED_TEMPLATE_ID'] and str(t.get('imageName') or '').endswith(digest)
          rate=float((p.get('runpod') or {}).get('rate')); assert 0 < rate <= 0.8
          lim=p.get('limits') or {}
          assert float(lim.get('hardCostUsd')) == 2.0 and int(lim.get('maxRuntimeMinutes')) == 75 and int(lim.get('maxCreates')) == 1
          print(json.dumps({'ready':True,'activePodCount':0,'rate':rate,'stockStatus':(p.get('runpod') or {}).get('stockStatus'),'totalOriginalBytes':a.get('totalOriginalBytes'),'paidMutationPerformed':False}))
          PY

      - name: One standing-authorized REST template CREATE
        id: launch
        shell: bash
        run: |
          set -euo pipefail
          # IMPORTANT: no retry on this paid POST. An ambiguous result is never resent.
          code=$(curl --max-time 90 -sS -o launch.json -w '%{http_code}' \
            --request POST "$BRIDGE_URL" \
            --header 'content-type: application/json' \
            --header "x-tivvlejoy-scenery-authorization: $SCENERY_AUTHORIZATION" \
            --header "x-tivvlejoy-runpod-key: $RUNPOD_API_KEY" \
            --data '{"action":"launch"}')
          python3 - <<'PY'
          import json
          p=json.load(open('launch.json'))
          safe={k:p.get(k) for k in ['schema','executionId','podId','podName','createEntered','createRequests','retryCreate','templateId','launchTransport','runpod','workerImage','workerEntrypoint','originalSourceCount','renderableSourceCount','unityPreservationOnlyCount','internalResolution','finalResolution','samples','error']}
          print(json.dumps(safe))
          PY
          test "$code" = '200'
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          p=json.load(open('launch.json'))
          assert p.get('schema') == 'TIVVLEJOY_SCENERY_ORIGINAL14_30S_LAUNCH_V1'
          assert p.get('executionId') == os.environ['EXPECTED_EXECUTION_ID']
          assert p.get('createEntered') is True and int(p.get('createRequests')) == 1
          assert p.get('retryCreate') is False
          assert p.get('templateId') == os.environ['EXPECTED_TEMPLATE_ID']
          assert str(p.get('workerImage') or '').endswith(os.environ['EXPECTED_IMAGE_DIGEST'])
          assert p.get('workerEntrypoint') == 'scenery-showcase-original14-entry.js'
          assert int(p.get('originalSourceCount')) == 14 and int(p.get('renderableSourceCount')) == 11 and int(p.get('unityPreservationOnlyCount')) == 3
          assert p.get('internalResolution') == '540x960' and p.get('finalResolution') == '1080x1920' and int(p.get('samples')) == 12
          pod=p.get('podId'); assert isinstance(pod,str) and pod
          print('pod_id='+pod)
          PY
          echo "WATCH_CUTOFF=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Watch Original14 materialization render encode and upload
        shell: bash
        run: |
          set -euo pipefail
          terminal=''
          pod_seen=0
          startup_seen=0
          consecutive_bridge_failures=0
          last_startup='NONE'
          last_frames='-1'
          for i in $(seq 1 320); do
            if ! curl --retry 5 --retry-all-errors --retry-delay 2 --max-time 45 -sS \
              --request POST "$BRIDGE_URL" \
              --header 'content-type: application/json' \
              --header "x-tivvlejoy-scenery-authorization: $SCENERY_AUTHORIZATION" \
              --header "x-tivvlejoy-runpod-key: $RUNPOD_API_KEY" \
              --data '{"action":"pod-status"}' -o pod-status.json; then
              consecutive_bridge_failures=$((consecutive_bridge_failures + 1))
              echo "poll=$i podStatus=BRIDGE_UNREACHABLE failures=$consecutive_bridge_failures"
              if [ "$consecutive_bridge_failures" -ge 20 ]; then exit 1; fi
              sleep 15; continue
            fi
            consecutive_bridge_failures=0
            if ! curl --retry 5 --retry-all-errors --retry-delay 2 --max-time 45 -sS "$BRIDGE_URL" -o render-status.json; then
              echo "poll=$i r2Status=BRIDGE_UNREACHABLE"; sleep 15; continue
            fi
            read -r exact_count desired uptime startup_stage startup_index frames_written render_state <<<"$(python3 - <<'PY'
          import json, os
          pod=json.load(open('pod-status.json')); render=json.load(open('render-status.json'))
          exact=pod.get('exact') or []; first=exact[0] if exact else {}; runtime=first.get('runtime') or {}
          startup=render.get('startup') or {}; status=render.get('status') or {}
          cutoff=os.environ.get('WATCH_CUTOFF') or ''
          status_at=str(status.get('at') or '')
          render_state=str(status.get('status') or 'NONE').replace(' ','_')
          # Ignore leftover R2 terminal status from a previous attempt with the same execution id.
          if render_state in {'FAILED','COMPLETE'} and cutoff and status_at and status_at < cutoff:
            render_state='STALE'
          print(int(pod.get('exactActiveCount') or 0),str(first.get('desiredStatus') or 'NONE').replace(' ','_'),int(runtime.get('uptimeInSeconds') or 0),str(startup.get('stage') or startup.get('result') or 'NONE').replace(' ','_'),int(startup.get('index') or 0),int(startup.get('framesWritten') or startup.get('frame') or 0),render_state)
          PY
          )"
            if [ "$startup_stage" != "$last_startup" ] || [ "$startup_index" != '0' ] || [ "$frames_written" != "$last_frames" ]; then
              echo "poll=$i exactActive=$exact_count desired=$desired uptime=$uptime startup=$startup_stage sourceIndex=$startup_index frames=$frames_written/900 state=$render_state"
              last_startup="$startup_stage"
              last_frames="$frames_written"
            elif [ $((i % 8)) -eq 0 ]; then
              echo "poll=$i exactActive=$exact_count desired=$desired uptime=$uptime startup=$startup_stage state=$render_state"
            fi
            if [ "$render_state" = 'COMPLETE' ]; then terminal='COMPLETE'; cp render-status.json status.json; break; fi
            if [ "$render_state" = 'FAILED' ]; then
              cp render-status.json status.json
              python3 - <<'PY'
          import json
          s=(json.load(open('status.json')).get('status') or {})
          print('Worker failed:',s.get('stage'),s.get('code'),s.get('message'))
          PY
              exit 1
            fi
            if [ "$exact_count" -gt 0 ]; then pod_seen=1
            elif [ "$pod_seen" -eq 1 ]; then echo 'Pod disappeared before terminal status'; exit 1
            elif [ "$i" -ge 8 ]; then echo 'Created pod not visible after two minutes'; exit 1; fi
            if [ "$startup_stage" != 'NONE' ]; then startup_seen=1; fi
            if [ "$i" -ge 100 ] && [ "$startup_seen" -eq 0 ]; then echo 'ORIGINAL14_STARTUP_WATCHDOG_25_MIN'; exit 1; fi
            sleep 15
          done
          test "$terminal" = 'COMPLETE'
          python3 - <<'PY'
          import json
          s=(json.load(open('status.json')).get('status') or {})
          assert s.get('status') == 'COMPLETE'
          assert s.get('resolution') == '1080x1920'
          assert int(s.get('fps')) == 30
          assert int(s.get('frameCount')) >= 900
          assert 29.8 <= float(s.get('durationSeconds')) <= 30.2
          assert int(s.get('originalSourceCount')) == 14
          assert int(s.get('renderableSourceCount')) == 11
          assert int(s.get('unityPreservationOnlyCount')) == 3
          assert int(s.get('collectionCount')) == 4
          assert int(s.get('materializedBytes')) == 3002049687
          assert s.get('internalResolution') == '540x960'
          assert int(s.get('samples')) == 12
          assert s.get('artifactSha256') == s.get('readbackSha256')
          assert s.get('commercialAssetsPublished') is False
          print(json.dumps({'status':s.get('status'),'resolution':s.get('resolution'),'fps':s.get('fps'),'frameCount':s.get('frameCount'),'durationSeconds':s.get('durationSeconds'),'originalSourceCount':s.get('originalSourceCount'),'renderableSourceCount':s.get('renderableSourceCount'),'unityPreservationOnlyCount':s.get('unityPreservationOnlyCount'),'materializedBytes':s.get('materializedBytes'),'artifactSha256':s.get('artifactSha256'),'commercialAssetsPublished':s.get('commercialAssetsPublished')}))
          PY

      - name: Download and independently verify final 30-second MP4
        shell: bash
        run: |
          set -euo pipefail
          command -v ffprobe >/dev/null
          curl --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS "$BRIDGE_URL?download=1" -o download.json
          python3 - <<'PY' > download-url.txt
          import json
          p=json.load(open('download.json')); s=p.get('status') or {}
          assert s.get('status') == 'COMPLETE'
          u=p.get('downloadUrl'); assert isinstance(u,str) and u.startswith('http')
          print(u)
          PY
          curl --retry 8 --retry-all-errors --retry-delay 3 --max-time 900 -sS --fail "$(cat download-url.txt)" -o tivvlejoy-scenery-original14-30s-v1.mp4
          ffprobe -v error -of json -show_streams -show_format tivvlejoy-scenery-original14-30s-v1.mp4 > ffprobe.json
          python3 - <<'PY'
          import json, os, fractions
          p=json.load(open('ffprobe.json')); v=next(s for s in p['streams'] if s.get('codec_type')=='video')
          assert int(v['width']) == 1080 and int(v['height']) == 1920
          duration=float(p['format']['duration']); assert 29.8 <= duration <= 30.2
          fps=float(fractions.Fraction(v.get('avg_frame_rate') or v.get('r_frame_rate') or '0/1')); assert 29.8 <= fps <= 30.2
          size=os.path.getsize('tivvlejoy-scenery-original14-30s-v1.mp4'); assert size > 100000
          print(json.dumps({'width':1080,'height':1920,'duration':duration,'fps':fps,'bytes':size}))
          PY

      - name: Upload finished TivvleJoy purchased-scenery video
        uses: actions/upload-artifact@v4
        with:
          name: tivvlejoy-scenery-original14-30s-v1
          path: |
            tivvlejoy-scenery-original14-30s-v1.mp4
            status.json
            ffprobe.json
            pod-status.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Always terminate exact Original14 showcase pod
        if: always()
        shell: bash
        run: |
          set +e
          code=$(curl --retry 8 --retry-all-errors --retry-delay 3 --max-time 90 -sS -o cleanup.json -w '%{http_code}' \
            --request POST "$BRIDGE_URL" \
            --header 'content-type: application/json' \
            --header "x-tivvlejoy-scenery-authorization: $SCENERY_AUTHORIZATION" \
            --header "x-tivvlejoy-runpod-key: $RUNPOD_API_KEY" \
            --data '{"action":"cleanup"}')
          python3 - <<'PY'
          import json
          try: p=json.load(open('cleanup.json'))
          except Exception: p={}
          safe={'matchedBefore':p.get('matchedBefore'),'terminatedCount':p.get('terminatedCount'),'remainingActiveExactName':p.get('remainingActiveExactName'),'billingCleanupConfirmed':p.get('billingCleanupConfirmed'),'createPerformed':p.get('createPerformed'),'error':p.get('error')}
          print(json.dumps(safe))
          assert p.get('billingCleanupConfirmed') is True
          assert int(p.get('remainingActiveExactName') or 0) == 0
          assert p.get('createPerformed') is False
          PY
          test "$code" = '200'
