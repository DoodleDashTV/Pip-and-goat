name: TivvleJoy Scenery Original14 Worker Image V1

on:
  push:
    branches:
      - cursor/tivvlejoy-scenery-showcase-30s-v1-73f1
    paths:
      - 'workers/runpod-blender/Dockerfile.scenery-showcase-original14'
      - 'workers/runpod-blender/src/scenery-showcase-original14-roles.js'
      - 'workers/runpod-blender/src/scenery-showcase-original14.js'
      - 'workers/runpod-blender/src/scenery-showcase-original14-entry.js'
      - 'workers/runpod-blender/test/scenery-showcase-original14-roles.test.js'
      - 'scripts/blender/scenery/showcase_original14_30s.py'
      - 'scripts/blender/scenery/showcase_original14_select.py'
      - 'scripts/blender/scenery/showcase_original14_select_test.py'
      - '.github/workflows/tivvlejoy-scenery-showcase-worker-image-original14-v1.yml'

concurrency:
  group: tivvlejoy-scenery-original14-worker-v1-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-publish-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_BRANCH: cursor/tivvlejoy-scenery-showcase-30s-v1-73f1
      EXPECTED_PARENT_DIGEST: sha256:d0564b2ff8002f680b3b853f85e6e324a543b8c0323d3e0ca36eeb3ffe34d353
    steps:
      - name: Refuse any other branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
      - name: Checkout triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Zero-cost syntax and safety checks
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/runpod-blender/src/scenery-showcase-original14-roles.js
          node --check workers/runpod-blender/src/scenery-showcase-original14.js
          node --check workers/runpod-blender/src/scenery-showcase-original14-entry.js
          node --test workers/runpod-blender/test/scenery-showcase-original14-roles.test.js
          python3 -m py_compile scripts/blender/scenery/showcase_original14_select.py scripts/blender/scenery/showcase_original14_30s.py
          (cd scripts/blender/scenery && python3 showcase_original14_select_test.py)
          grep -F "FROM ghcr.io/doodledashtv/ddp-runpod-blender@${EXPECTED_PARENT_DIGEST}" workers/runpod-blender/Dockerfile.scenery-showcase-original14
          grep -F 'tivvlejoy.scenery.original.source.count="14"' workers/runpod-blender/Dockerfile.scenery-showcase-original14
          grep -F 'tivvlejoy.scenery.renderable.source.count="11"' workers/runpod-blender/Dockerfile.scenery-showcase-original14
          grep -F 'SCENERY_SHOWCASE_INTERNAL_RESOLUTION=540x960' workers/runpod-blender/Dockerfile.scenery-showcase-original14
          grep -F 'SCENERY_SHOWCASE_EEVEE_SAMPLES=12' workers/runpod-blender/Dockerfile.scenery-showcase-original14
          ! grep -R -nE 'RUNPOD_API_KEY\s*=|R2_SECRET_ACCESS_KEY\s*=|OBJECT_STORAGE_SECRET_ACCESS_KEY\s*=' workers/runpod-blender/Dockerfile.scenery-showcase-original14 workers/runpod-blender/src/scenery-showcase-original14*.js scripts/blender/scenery/showcase_original14_30s.py
      - name: Resolve image repository
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REPO=ghcr.io/${owner}/ddp-runpod-blender" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=scenery-original14-v1-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Original14 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/runpod-blender/Dockerfile.scenery-showcase-original14
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          build-args: |
            TIVVLEJOY_SCENERY_SOURCE_COMMIT=${{ github.sha }}
            TIVVLEJOY_SCENERY_BUILD_TIME=${{ github.event.head_commit.timestamp }}
          provenance: false
          sbom: false
      - name: Verify immutable published digest
        shell: bash
        env:
          PUBLISHED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${PUBLISHED_DIGEST}"
          case "${PUBLISHED_DIGEST}" in sha256:*) ;; *) echo 'Missing sha256 digest'; exit 1 ;; esac
          docker buildx imagetools inspect "${IMAGE_REPO}:${IMAGE_TAG}" >/tmp/original14-image.txt
          grep -F "${PUBLISHED_DIGEST}" /tmp/original14-image.txt
          mkdir -p artifacts/scenery-original14-worker-v1
          python3 - <<'PY'
          import json, os
          evidence={
            'schema':'TIVVLEJOY_SCENERY_ORIGINAL14_WORKER_IMAGE_V1',
            'status':'PUBLISHED_IMMUTABLE_DIGEST','sourceCommit':os.environ['GITHUB_SHA'],
            'sourceBranch':os.environ['GITHUB_REF_NAME'],'parentDigest':os.environ['EXPECTED_PARENT_DIGEST'],
            'imageRepository':os.environ['IMAGE_REPO'],'tag':os.environ['IMAGE_TAG'],'digest':os.environ['PUBLISHED_DIGEST'],
            'ref':f"{os.environ['IMAGE_REPO']}@{os.environ['PUBLISHED_DIGEST']}",
            'blenderVersion':'4.2.2','originalSourceCount':14,'renderableSourceCount':11,
            'unityPreservationOnlyCount':3,'internalResolution':'540x960','finalResolution':'1080x1920',
            'fps':30,'frameCount':900,'samples':12,'commercialAssetsBaked':False,
            'paidGpuLaunchCount':0,'runpodContacted':False,'credentialsIncluded':False,
          }
          open('artifacts/scenery-original14-worker-v1/image.json','w').write(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence))
          PY
      - name: Upload sanitized image evidence
        uses: actions/upload-artifact@v4
        with:
          name: tivvlejoy-scenery-original14-worker-image-v1
          path: artifacts/scenery-original14-worker-v1/image.json
          if-no-files-found: error
          retention-days: 30
