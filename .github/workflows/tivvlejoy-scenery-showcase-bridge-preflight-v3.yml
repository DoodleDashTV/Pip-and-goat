name: TivvleJoy Scenery Showcase Bridge Preflight V3

on:
  push:
    branches:
      - cursor/tivvlejoy-scenery-showcase-30s-v1-73f1
    paths:
      - '.github/workflows/tivvlejoy-scenery-showcase-bridge-preflight-v3.yml'

permissions:
  contents: read

concurrency:
  group: tivvlejoy-scenery-showcase-bridge-preflight-v3
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRIDGE_URL: https://pip-and-goat-git-cursor-tivvlejoy-a91ad2-doodledashtvs-projects.vercel.app/api/scenery/showcase-30s-v3
      SCENERY_AUTHORIZATION: TIVVLEJOY_SCENERY_SHOWCASE_30S_PAID_EXECUTION_AUTHORIZATION_V3
      EXPECTED_TEMPLATE_ID: 6yz7wkmu34
      EXPECTED_IMAGE: ghcr.io/doodledashtv/ddp-runpod-blender@sha256:7e8bf43653ebd81d1f3fd4452bb2181a1dc11fd97c0ee69789d67b072eebf673
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Verify V3 bridge without paid mutation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNPOD_API_KEY"
          code=$(curl --retry 8 --retry-all-errors --retry-delay 3 --max-time 90 -sS -o preflight-v3.json -w '%{http_code}' \
            --request POST "$BRIDGE_URL" \
            --header 'content-type: application/json' \
            --header "x-tivvlejoy-scenery-authorization: $SCENERY_AUTHORIZATION" \
            --header "x-tivvlejoy-runpod-key: $RUNPOD_API_KEY" \
            --data '{"action":"preflight"}')
          test "$code" = '200'
          python3 - <<'PY'
          import json, os
          p=json.load(open('preflight-v3.json'))
          assert p.get('schema') == 'TIVVLEJOY_SCENERY_SHOWCASE_30S_PREFLIGHT_V5'
          assert p.get('ready') is True
          assert p.get('paidMutationPerformed') is False
          assert p.get('workerImage') == os.environ['EXPECTED_IMAGE']
          assert p.get('workerImagePinned') is True
          assert p.get('workerEntrypoint') == 'scenery-showcase-entry-v2.js'
          assert p.get('launchTransport') == 'RUNPOD_REST_TEMPLATE'
          assert p.get('runtimeDockerArgsRequired') is False
          assert int(p.get('startupWatchdogMinutes')) == 20
          assert int(p.get('activePodCount')) == 0
          assets=p.get('assets') or {}
          assert assets.get('ok') is True
          assert int(assets.get('satisfiedRoleCount')) == 12
          assert assets.get('missingRoles') == []
          template=p.get('template') or {}
          assert template.get('templateId') == os.environ['EXPECTED_TEMPLATE_ID']
          assert template.get('imageName') == os.environ['EXPECTED_IMAGE']
          runpod=p.get('runpod') or {}
          rate=float(runpod.get('rate'))
          assert 0 < rate <= 0.8
          limits=p.get('limits') or {}
          assert int(limits.get('maxCreates')) == 1
          assert float(limits.get('maxHourlyUsd')) == 0.8
          assert float(limits.get('hardCostUsd')) == 2.0
          safe={
            'ready':p.get('ready'),
            'templateId':template.get('templateId'),
            'workerImage':p.get('workerImage'),
            'workerEntrypoint':p.get('workerEntrypoint'),
            'launchTransport':p.get('launchTransport'),
            'runtimeDockerArgsRequired':p.get('runtimeDockerArgsRequired'),
            'startupWatchdogMinutes':p.get('startupWatchdogMinutes'),
            'activePodCount':p.get('activePodCount'),
            'listedObjectCount':p.get('listedObjectCount'),
            'satisfiedRoleCount':assets.get('satisfiedRoleCount'),
            'missingRoles':assets.get('missingRoles'),
            'secureUsdPerHr':rate,
            'stockStatus':runpod.get('stockStatus'),
            'paidMutationPerformed':p.get('paidMutationPerformed'),
          }
          print(json.dumps(safe))
          open('preflight-v3-safe.json','w').write(json.dumps(safe,indent=2)+'\n')
          PY

      - name: Upload sanitized V3 preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: tivvlejoy-scenery-showcase-bridge-preflight-v3
          path: preflight-v3-safe.json
          if-no-files-found: error
          retention-days: 14
