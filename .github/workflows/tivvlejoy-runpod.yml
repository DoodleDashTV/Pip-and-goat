name: TivvleJoy RunPod

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: validate
        type: choice
        options:
          - validate
          - connectivity
      confirm_paid_gpu:
        description: Must remain false unless a future workflow explicitly adds paid GPU launch support
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  runpod-safety:
    name: TivvleJoy RunPod safety check
    runs-on: ubuntu-latest
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Refuse paid GPU launch
        if: ${{ inputs.confirm_paid_gpu }}
        run: |
          set -euo pipefail
          echo "Paid GPU execution is not enabled in this workflow."

      - name: Validate configuration
        if: ${{ inputs.mode == 'validate' && !inputs.confirm_paid_gpu }}
        run: |
          set -euo pipefail
          if [ -n "${RUNPOD_API_KEY:-}" ]; then
            echo "RUNPOD_API_KEY secret is configured."
          else
            echo "RUNPOD_API_KEY secret is missing."
            exit 1
          fi
          echo "Mode: validate"
          echo "Network request: none"
          echo "Paid GPU launch: disabled"

      - name: Connectivity check
        if: ${{ inputs.mode == 'connectivity' && !inputs.confirm_paid_gpu }}
        run: |
          set -euo pipefail
          if [ -z "${RUNPOD_API_KEY:-}" ]; then
            echo "RUNPOD_API_KEY secret is missing."
            exit 1
          fi
          status="$(
            curl -sS \
              -o /dev/null \
              -w '%{http_code}' \
              --connect-timeout 20 \
              --max-time 40 \
              -X POST \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
              --data '{"query":"{ myself { id } }"}' \
              'https://api.runpod.io/graphql'
          )"
          case "${status}" in
            2[0-9][0-9])
              echo "connectivity PASS"
              ;;
            *)
              echo "connectivity FAIL"
              exit 1
              ;;
          esac
