name: TivvleJoy RunPod

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: validate
        type: choice
        options:
          - validate
          - connectivity
          - render_plan
          - render_launch
      confirm_paid_gpu:
        description: Must be true only for render_launch, together with the exact paid approval phrase
        required: true
        default: false
        type: boolean
      paid_approval_phrase:
        description: Required exact phrase LAUNCH_TIVVLEJOY_GPU for render_launch. Leave empty for other modes.
        required: true
        type: string
        default: ''

permissions:
  contents: read

jobs:
  runpod-safety:
    name: TivvleJoy RunPod safety check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_RENDER_TEMPLATE_ID: ${{ secrets.RUNPOD_RENDER_TEMPLATE_ID }}
      # Hard refusal thresholds, not spending targets.
      TIVVLEJOY_GPU_TYPE_ID: NVIDIA GeForce RTX 4090
      TIVVLEJOY_CLOUD_TYPE: SECURE
      TIVVLEJOY_GPU_COUNT: '1'
      MAX_HOURLY_USD: '0.75'
      MAX_RUNTIME_MINUTES: '20'
      MAX_COMPUTE_USD: '0.25'
    steps:
      - name: Refuse paid GPU launch outside render_launch
        if: ${{ inputs.confirm_paid_gpu && inputs.mode != 'render_launch' }}
        run: |
          set -euo pipefail
          echo "Paid GPU execution is not enabled in this mode."
          echo "Use mode render_launch with confirm_paid_gpu and LAUNCH_TIVVLEJOY_GPU to request a guarded launch."

      - name: Validate configuration
        if: ${{ inputs.mode == 'validate' && !inputs.confirm_paid_gpu }}
        run: |
          set -euo pipefail
          if [ -n "${RUNPOD_API_KEY:-}" ]; then
            echo "RUNPOD_API_KEY secret is configured."
          else
            echo "RUNPOD_API_KEY secret is missing."
            exit 1
          fi
          echo "Mode: validate"
          echo "Network request: none"
          echo "Paid GPU launch: disabled"

      - name: Connectivity check
        if: ${{ inputs.mode == 'connectivity' && !inputs.confirm_paid_gpu }}
        run: |
          set -euo pipefail
          if [ -z "${RUNPOD_API_KEY:-}" ]; then
            echo "RUNPOD_API_KEY secret is missing."
            exit 1
          fi
          status="$(
            curl -sS \
              -o /dev/null \
              -w '%{http_code}' \
              --connect-timeout 20 \
              --max-time 40 \
              -X POST \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
              --data '{"query":"{ myself { id } }"}' \
              'https://api.runpod.io/graphql'
          )"
          case "${status}" in
            2[0-9][0-9])
              echo "connectivity PASS"
              ;;
            *)
              echo "connectivity FAIL"
              exit 1
              ;;
          esac

      - name: Checkout repository
        if: ${{ inputs.mode == 'render_plan' || inputs.mode == 'render_launch' }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Render plan
        if: ${{ inputs.mode == 'render_plan' }}
        run: |
          set -euo pipefail
          node scripts/cloud/tivvlejoy-guarded-render.mjs render-plan

      - name: Guarded render launch
        if: ${{ inputs.mode == 'render_launch' }}
        env:
          CONFIRM_PAID_GPU: ${{ inputs.confirm_paid_gpu }}
          PAID_APPROVAL_PHRASE: ${{ inputs.paid_approval_phrase }}
          TIVVLEJOY_POD_ID_FILE: ${{ runner.temp }}/tivvlejoy-runpod-pod-id
        run: |
          set -euo pipefail
          cleanup_on_exit() {
            node scripts/cloud/tivvlejoy-guarded-render.mjs cleanup
          }
          trap cleanup_on_exit EXIT
          node scripts/cloud/tivvlejoy-guarded-render.mjs render-launch
          # Future remote scene execution would be bounded by MAX_RUNTIME_MINUTES here.
          echo "Scene execution is the next TivvleJoy integration boundary."
          echo "No remote Blender render command is invoked in this workflow."
          echo "The created Pod is stopped and deleted automatically."

      - name: Stop and delete RunPod Pod
        if: ${{ always() && inputs.mode == 'render_launch' }}
        env:
          TIVVLEJOY_POD_ID_FILE: ${{ runner.temp }}/tivvlejoy-runpod-pod-id
        run: |
          set -euo pipefail
          if [ ! -f scripts/cloud/tivvlejoy-guarded-render.mjs ]; then
            if [ -n "${TIVVLEJOY_POD_ID:-}" ] || [ -f "${TIVVLEJOY_POD_ID_FILE}" ]; then
              echo "RUNPOD CLEANUP REQUIRES ATTENTION"
              echo "Pod ID: ${TIVVLEJOY_POD_ID:-$(cat "${TIVVLEJOY_POD_ID_FILE}")}"
              exit 1
            fi
            echo "Cleanup: no Pod was created. Nothing to delete."
            exit 0
          fi
          if ! node scripts/cloud/tivvlejoy-guarded-render.mjs cleanup; then
            echo "RUNPOD CLEANUP REQUIRES ATTENTION"
            if [ -n "${TIVVLEJOY_POD_ID:-}" ]; then
              echo "Pod ID: ${TIVVLEJOY_POD_ID}"
            elif [ -f "${TIVVLEJOY_POD_ID_FILE}" ]; then
              echo "Pod ID: $(cat "${TIVVLEJOY_POD_ID_FILE}")"
            fi
            exit 1
          fi
