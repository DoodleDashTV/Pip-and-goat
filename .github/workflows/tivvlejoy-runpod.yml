name: TivvleJoy RunPod

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Safe RunPod check mode
        required: true
        default: render_plan
        type: choice
        options:
          - render_plan
          - validate
          - connectivity

permissions:
  contents: read

jobs:
  runpod-safety:
    name: TivvleJoy RunPod safety check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Validate configuration
        if: ${{ inputs.mode == 'validate' }}
        run: |
          set -euo pipefail
          if [ -n "${RUNPOD_API_KEY:-}" ]; then
            echo "RUNPOD_API_KEY secret is configured."
          else
            echo "RUNPOD_API_KEY secret is missing."
            exit 1
          fi
          echo "Mode: validate"
          echo "Network request: none"
          echo "Paid GPU launch: disabled"

      - name: Connectivity check
        if: ${{ inputs.mode == 'connectivity' }}
        run: |
          set -euo pipefail
          if [ -z "${RUNPOD_API_KEY:-}" ]; then
            echo "RUNPOD_API_KEY secret is missing."
            exit 1
          fi
          status="$(
            curl -sS \
              -o /dev/null \
              -w '%{http_code}' \
              --connect-timeout 20 \
              --max-time 40 \
              -X POST \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
              --data '{"query":"{ myself { id } }"}' \
              'https://api.runpod.io/graphql'
          )"
          case "${status}" in
            2[0-9][0-9])
              echo "connectivity PASS"
              ;;
            *)
              echo "connectivity FAIL"
              exit 1
              ;;
          esac

      - name: Checkout repository
        if: ${{ inputs.mode == 'render_plan' }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Render plan
        if: ${{ inputs.mode == 'render_plan' }}
        run: |
          set -euo pipefail
          node scripts/cloud/tivvlejoy-render-plan.mjs
