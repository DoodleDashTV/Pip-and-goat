# TivvleJoy paid smoke attempt #2 — zero-cost validation only.
# This workflow never creates a Pod or GPU. Never prints secrets.
name: TivvleJoy RunPod Paid Smoke Attempt 2 Preflight

on:
  push:
    branches:
      - cursor/tivvlejoy-runpod-paid-smoke-attempt-2-73f1

concurrency:
  group: tivvlejoy-paid-smoke-attempt-2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  paid-smoke-attempt-2-preflight:
    name: Paid smoke attempt #2 zero-cost preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUNPOD_RENDER_TEMPLATE_ID: 34a9iknfuc
    steps:
      - name: Print safe checkout identity
        run: |
          set -euo pipefail
          echo "github.sha=${GITHUB_SHA}"
          echo "github.ref_name=${GITHUB_REF_NAME}"

      - name: Refuse any other branch
        run: |
          set -euo pipefail
          expected='cursor/tivvlejoy-runpod-paid-smoke-attempt-2-73f1'
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "REFUSED: this workflow only runs on ${expected}"
            exit 1
          fi

      - name: Checkout triggering SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Zero-cost contract tests
        run: |
          set -euo pipefail
          pnpm validate:runpod-one-pod-paid-smoke
          pnpm validate:runpod-real-lifecycle
          pnpm validate:runpod-lifecycle
          pnpm validate:runpod-template-binding
          pnpm validate:runpod-template-normalization
          pnpm validate:runpod-template-readiness
          pnpm validate:runpod-worker-image
          pnpm validate:runpod-pod-payload
          pnpm validate:runpod-blender-foundation
          pnpm validate:runpod-guarded
          pnpm --filter @doodle-dash/web lint

      - name: Verify pinned worker image and dry-runs
        run: |
          set -euo pipefail
          pnpm cloud:verify-image
          pnpm cloud:preflight-offline
          pnpm cloud:runpod-launch-dry-run
          pnpm cloud:runpod-lifecycle-dry-run
          pnpm cloud:runpod-real-lifecycle-preflight
          pnpm cloud:runpod-one-pod-paid-smoke
