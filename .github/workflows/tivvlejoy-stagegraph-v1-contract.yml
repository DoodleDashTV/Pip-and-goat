name: TivvleJoy StageGraph V1 Contract

on:
  pull_request:
    paths:
      - "workers/runpod-blender/src/stagegraph-production-contract-v1.js"
      - "workers/runpod-blender/src/stagegraph-recipe-contract-v1.js"
      - "workers/runpod-blender/src/stagegraph-recipe-runner-v1.js"
      - "workers/runpod-blender/test/stagegraph-production-contract-v1.test.js"
      - "workers/runpod-blender/test/stagegraph-current-receipts-v1.test.js"
      - "workers/runpod-blender/test/stagegraph-recipe-contract-v1.test.js"
      - "recipes/tivvlejoy-stagegraph/**"
      - "artifacts/tivvlejoy-stagegraph-v1/*.json"
      - "scripts/blender/stagegraph/**"
      - "config/tivvlejoy-stagegraph-v1.json"
      - "config/tivvlejoy-recipe-v1.schema.json"
      - ".github/workflows/tivvlejoy-stagegraph-v1-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Node production gates, recipes, and committed receipts
        run: node --test workers/runpod-blender/test/stagegraph-production-contract-v1.test.js workers/runpod-blender/test/stagegraph-current-receipts-v1.test.js workers/runpod-blender/test/stagegraph-vendor-reference-authorization-v1.test.js workers/runpod-blender/test/stagegraph-recipe-contract-v1.test.js
      - name: Validate active recipe execution plan
        run: node workers/runpod-blender/src/stagegraph-recipe-runner-v1.js plan recipes/tivvlejoy-stagegraph/005_vendor_reference_alpha_repair_v1.json > /tmp/tivvlejoy-recipe-plan.json
      - name: Verify committed zero-paid alpha-repair result
        run: node workers/runpod-blender/src/stagegraph-recipe-runner-v1.js verify-result recipes/tivvlejoy-stagegraph/005_vendor_reference_alpha_repair_v1.json artifacts/tivvlejoy-stagegraph-v1/VENDOR_REFERENCE_ALPHA_REPAIR_RESULT.json
      - name: Validate Blender asset-audit contract
        working-directory: scripts/blender/stagegraph
        run: python -m unittest -v test_asset_certify_contract_v1.py test_ecokit_cycles_alpha_v1.py
      - name: Validate vendor-reference authorization and fail-closed executor
        working-directory: scripts/cloud/stagegraph-v1
        run: python -m unittest -v test_execute_vendor_reference_frame_v1.py
      - name: Syntax-check Blender StageGraph entrypoints
        run: python -m py_compile scripts/blender/stagegraph/asset_certify_blender_v1.py scripts/blender/stagegraph/asset_inventory_blender_v1.py scripts/blender/stagegraph/vendor_reference_render_v1.py scripts/blender/stagegraph/ecokit_cycles_alpha_v1.py scripts/blender/stagegraph/inspect_ecokit_materials_v1.py scripts/blender/stagegraph/foliage_alpha_diagnose_v1.py scripts/cloud/stagegraph-v1/execute_vendor_reference_frame_v1.py scripts/cloud/stagegraph-v1/pod_entry_vendor_reference_v1.py
