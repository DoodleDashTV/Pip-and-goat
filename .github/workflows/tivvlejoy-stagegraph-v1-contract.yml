name: TivvleJoy StageGraph V1 Contract

on:
  pull_request:
    paths:
      - "workers/runpod-blender/src/stagegraph-production-contract-v1.js"
      - "workers/runpod-blender/test/stagegraph-production-contract-v1.test.js"
      - "scripts/blender/stagegraph/**"
      - "config/tivvlejoy-stagegraph-v1.json"
      - ".github/workflows/tivvlejoy-stagegraph-v1-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Node production gates
        run: node --test workers/runpod-blender/test/stagegraph-production-contract-v1.test.js
      - name: Validate Blender asset-audit contract
        working-directory: scripts/blender/stagegraph
        run: python -m unittest -v test_asset_certify_contract_v1.py
      - name: Syntax-check Blender audit entrypoint
        run: python -m py_compile scripts/blender/stagegraph/asset_certify_blender_v1.py
