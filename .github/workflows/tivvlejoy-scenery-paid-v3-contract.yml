name: TivvleJoy Scenery Paid V3 Contract Check

on:
  push:
    branches:
      - cursor/tivvlejoy-scenery-showcase-30s-v1-73f1
    paths:
      - '.github/workflows/tivvlejoy-scenery-showcase-paid-render-v3.yml'
      - '.github/workflows/tivvlejoy-scenery-paid-v3-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate paid V3 workflow is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          f=Path('.github/workflows/tivvlejoy-scenery-showcase-paid-render-v3.yml')
          auth=Path('artifacts/tivvlejoy-scenery-showcase-30s/PAID_AUTHORIZATION_V3.json')
          text=f.read_text()
          required=[
            str(auth),
            'TIVVLEJOY_SCENERY_SHOWCASE_30S_PAID_EXECUTION_AUTHORIZATION_V3',
            '6yz7wkmu34',
            'RUNPOD_REST_TEMPLATE',
            'One authorized REST template CREATE',
            'Always terminate exact V3 showcase pod',
            "assert int(p.get('createRequests')) == 1",
            "assert p.get('retryCreate') is False",
            "assert int((p.get('limits') or {}).get('maxCreates')) == 1",
            "assert p.get('commercialAssetsPublished') is False",
            "assert p.get('billingCleanupConfirmed') is True",
            "assert int(p.get('remainingActiveExactName') or 0) == 0",
          ]
          for needle in required:
              assert needle in text, needle
          trigger=text[text.index('\non:\n'):text.index('\npermissions:\n')]
          assert 'workflow_dispatch' not in trigger
          assert 'schedule:' not in trigger
          assert str(auth) in trigger
          assert text.count('{"action":"launch"}') == 1, text.count('{"action":"launch"}')
          start=text.index('- name: One authorized REST template CREATE')
          end=text.index('- name: Watch RunPod provisioning and verified R2 render status')
          launch=text[start:end]
          assert '--retry' not in launch, 'Launch POST must never retry'
          assert '--data \'{"action":"launch"}\'' in launch
          assert not auth.exists(), 'V3 authorization unexpectedly exists'
          print('TIVVLEJOY_SCENERY_PAID_V3_CONTRACT_PASS: no paid mutation performed')
          PY
