name: TivvleJoy Real Scenery 30s Paid Render V6

on:
  push:
    branches:
      - cursor/tivvlejoy-scenery-showcase-30s-v1-73f1
    paths:
      - 'artifacts/tivvlejoy-scenery-showcase-30s/PAID_AUTHORIZATION_V6.json'

permissions:
  contents: read

concurrency:
  group: tivvlejoy-real-scenery-30s-paid-render-v6
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 145
    env:
      BRIDGE_URL: https://pip-and-goat-git-cursor-tivvlejoy-a91ad2-doodledashtvs-projects.vercel.app/api/scenery/showcase-30s-v6
      SCENERY_AUTHORIZATION: TIVVLEJOY_SCENERY_SHOWCASE_30S_PAID_EXECUTION_AUTHORIZATION_V6
      EXPECTED_TEMPLATE_ID: kpuairdt8y
      EXPECTED_IMAGE: ghcr.io/doodledashtv/ddp-runpod-blender@sha256:d0564b2ff8002f680b3b853f85e6e324a543b8c0323d3e0ca36eeb3ffe34d353
      EXPECTED_EXECUTION_ID: scenery-showcase-30s-v6-20260828
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Checkout authorization commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate exact V6 authorization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          p=json.load(open('artifacts/tivvlejoy-scenery-showcase-30s/PAID_AUTHORIZATION_V6.json'))
          assert p.get('schema') == 'TIVVLEJOY_SCENERY_SHOWCASE_30S_PAID_EXECUTION_AUTHORIZATION_V6'
          assert p.get('authorized') is True
          assert p.get('executionId') == os.environ['EXPECTED_EXECUTION_ID']
          assert p.get('templateId') == os.environ['EXPECTED_TEMPLATE_ID']
          assert p.get('workerImage') == os.environ['EXPECTED_IMAGE']
          assert p.get('launchTransport') == 'RUNPOD_REST_TEMPLATE'
          assert int(p.get('maxCreates')) == 1
          assert p.get('noRetry') is True
          assert float(p.get('maxHourlyUsd')) == 0.8
          assert float(p.get('hardCostUsd')) == 2.0
          assert int(p.get('startupWatchdogMinutes')) == 20
          assert int(p.get('maxRuntimeMinutes')) == 120
          assert int(p.get('requiredRoleCount')) == 10
          assert p.get('purchasedSceneryOnly') is True
          assert p.get('sourceFirstSelection') is True
          assert p.get('perAssetProgress') is True
          assert p.get('commercialAssetsPublished') is False
          print('V6 authorization contract PASS')
          PY

      - name: Zero-cost V6 preflight immediately before CREATE
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNPOD_API_KEY"
          code=$(curl --retry 8 --retry-all-errors --retry-delay 3 --max-time 90 -sS -o preflight.json -w '%{http_code}' \
            --request POST "$BRIDGE_URL" \
            --header 'content-type: application/json' \
            --header "x-tivvlejoy-scenery-authorization: $SCENERY_AUTHORIZATION" \
            --header "x-tivvlejoy-runpod-key: $RUNPOD_API_KEY" \
            --data '{"action":"preflight"}')
          cat preflight.json
          test "$code" = '200'
          python3 - <<'PY'
          import json, os
          p=json.load(open('preflight.json'))
          assert p.get('schema') == 'TIVVLEJOY_SCENERY_SHOWCASE_30S_PREFLIGHT_V8'
          assert p.get('ready') is True and p.get('paidMutationPerformed') is False
          assert p.get('workerImage') == os.environ['EXPECTED_IMAGE']
          assert p.get('launchTransport') == 'RUNPOD_REST_TEMPLATE'
          assert p.get('sourceFirstSelection') is True
          assert p.get('perAssetProgress') is True
          assert int(p.get('activePodCount')) == 0
          assert int(p.get('requiredRoleCount')) == 10
          a=p.get('assets') or {}
          assert a.get('ready') is True and a.get('purchasedSceneryOnly') is True
          assert int(a.get('requiredRoleCount')) == 10 and int(a.get('selectedRoleCount')) == 10
          assert int(a.get('selectedTotalBytes')) <= int(a.get('hardInputCapBytes')) == 5*1024*1024*1024
          t=p.get('template') or {}
          assert t.get('templateId') == os.environ['EXPECTED_TEMPLATE_ID']
          assert t.get('imageName') == os.environ['EXPECTED_IMAGE']
          rate=float((p.get('runpod') or {}).get('rate'))
          assert 0 < rate <= 0.8
          assert int((p.get('limits') or {}).get('maxCreates')) == 1
          print(json.dumps({'ready':True,'templateId':t.get('templateId'),'rate':rate,'stockStatus':(p.get('runpod') or {}).get('stockStatus'),'activePodCount':0,'paidMutationPerformed':False}))
          PY

      - name: One authorized REST template CREATE
        id: launch
        shell: bash
        run: |
          set -euo pipefail
          # Never retry this paid POST. An ambiguous result is cleaned up, not resent.
          code=$(curl --max-time 90 -sS -o launch.json -w '%{http_code}' \
            --request POST "$BRIDGE_URL" \
            --header 'content-type: application/json' \
            --header "x-tivvlejoy-scenery-authorization: $SCENERY_AUTHORIZATION" \
            --header "x-tivvlejoy-runpod-key: $RUNPOD_API_KEY" \
            --data '{"action":"launch"}')
          python3 - <<'PY'
          import json
          p=json.load(open('launch.json'))
          safe={k:p.get(k) for k in ['schema','executionId','podId','podName','createEntered','createRequests','retryCreate','templateId','launchTransport','runpod','workerImage','workerEntrypoint','requiredRoleCount','sourceFirstSelection','perAssetProgress','error']}
          print(json.dumps(safe))
          PY
          test "$code" = '200'
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          p=json.load(open('launch.json'))
          assert p.get('schema') == 'TIVVLEJOY_SCENERY_SHOWCASE_30S_LAUNCH_V8'
          assert p.get('executionId') == os.environ['EXPECTED_EXECUTION_ID']
          assert p.get('createEntered') is True and int(p.get('createRequests')) == 1
          assert p.get('retryCreate') is False
          assert p.get('templateId') == os.environ['EXPECTED_TEMPLATE_ID']
          assert p.get('workerImage') == os.environ['EXPECTED_IMAGE']
          assert p.get('launchTransport') == 'RUNPOD_REST_TEMPLATE'
          assert p.get('sourceFirstSelection') is True and p.get('perAssetProgress') is True
          pod=p.get('podId'); assert isinstance(pod,str) and pod
          print('pod_id='+pod)
          PY

      - name: Watch RunPod and verified R2 render status with per-asset progress
        shell: bash
        run: |
          set -euo pipefail
          terminal=''
          pod_seen=0
          process_seen=0
          last_completed=-1
          consecutive_bridge_failures=0
          for i in $(seq 1 480); do
            if ! curl --retry 5 --retry-all-errors --retry-delay 2 --max-time 45 -sS \
              --request POST "$BRIDGE_URL" \
              --header 'content-type: application/json' \
              --header "x-tivvlejoy-scenery-authorization: $SCENERY_AUTHORIZATION" \
              --header "x-tivvlejoy-runpod-key: $RUNPOD_API_KEY" \
              --data '{"action":"pod-status"}' -o pod-status.json; then
              consecutive_bridge_failures=$((consecutive_bridge_failures + 1))
              if [ "$consecutive_bridge_failures" -ge 20 ]; then exit 1; fi
              sleep 15; continue
            fi
            consecutive_bridge_failures=0
            if ! curl --retry 5 --retry-all-errors --retry-delay 2 --max-time 45 -sS "$BRIDGE_URL" -o render-status.json; then
              sleep 15; continue
            fi
            read -r exact_count desired startup_stage completed total completed_role completed_bytes selected_bytes render_state <<<"$(python3 - <<'PY'
          import json
          pod=json.load(open('pod-status.json')); render=json.load(open('render-status.json'))
          exact=pod.get('exact') or []; first=exact[0] if exact else {}
          startup=render.get('startup') or {}; status=render.get('status') or {}
          def tok(v): return str(v if v is not None else 'NONE').replace(' ','_')
          print(int(pod.get('exactActiveCount') or 0),tok(first.get('desiredStatus')),tok(startup.get('stage') or startup.get('result')),int(startup.get('completedAssets') or 0),int(startup.get('totalAssets') or 0),tok(startup.get('completedRole')),int(startup.get('completedBytes') or 0),int(startup.get('selectedTotalBytes') or 0),tok(status.get('status')))
          PY
          )"
            echo "poll=$i exactActive=$exact_count desired=$desired startup=$startup_stage assets=$completed/$total role=$completed_role bytes=$completed_bytes/$selected_bytes state=$render_state"
            if [ "$completed" -gt "$last_completed" ]; then last_completed=$completed; fi
            if [ "$render_state" = 'COMPLETE' ]; then terminal='COMPLETE'; cp render-status.json status.json; break; fi
            if [ "$render_state" = 'FAILED' ]; then
              cp render-status.json status.json
              python3 - <<'PY'
          import json
          s=(json.load(open('status.json')).get('status') or {})
          print('Worker failed:',s.get('stage'),s.get('code'),s.get('message'))
          PY
              exit 1
            fi
            if [ "$exact_count" -gt 0 ]; then pod_seen=1
            elif [ "$pod_seen" -eq 1 ]; then echo 'Pod disappeared before COMPLETE'; exit 1
            elif [ "$i" -ge 4 ]; then echo 'Created Pod not visible within first minute'; exit 1; fi
            if [ "$startup_stage" != 'NONE' ]; then process_seen=1; fi
            if [ "$i" -ge 80 ] && [ "$process_seen" -eq 0 ]; then echo 'STARTUP_PROVISIONING_WATCHDOG'; exit 1; fi
            sleep 15
          done
          test "$terminal" = 'COMPLETE'
          python3 - <<'PY'
          import json
          s=(json.load(open('status.json')).get('status') or {})
          assert s.get('status') == 'COMPLETE'
          assert s.get('resolution') == '1080x1920'
          assert int(s.get('fps')) == 30
          assert int(s.get('frameCount')) >= 900
          assert abs(float(s.get('durationSeconds'))-30.0) <= 0.1
          assert int(s.get('selectedRoleCount')) == 10
          assert s.get('artifactSha256') == s.get('readbackSha256')
          assert s.get('commercialAssetsPublished') is False
          print(json.dumps({'status':s.get('status'),'frameCount':s.get('frameCount'),'resolution':s.get('resolution'),'fps':s.get('fps'),'durationSeconds':s.get('durationSeconds'),'selectedRoleCount':s.get('selectedRoleCount'),'selectedTotalBytes':s.get('selectedTotalBytes'),'artifactSha256':s.get('artifactSha256'),'commercialAssetsPublished':s.get('commercialAssetsPublished')}))
          PY

      - name: Download and independently verify MP4
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 -sS "$BRIDGE_URL?download=1" -o download.json
          python3 - <<'PY' > download-url.txt
          import json
          p=json.load(open('download.json')); s=p.get('status') or {}
          assert s.get('status') == 'COMPLETE'
          u=p.get('downloadUrl'); assert isinstance(u,str) and u.startswith('http')
          print(u)
          PY
          curl --retry 8 --retry-all-errors --retry-delay 3 --max-time 900 -sS --fail "$(cat download-url.txt)" -o tivvlejoy-scenery-showcase-30s-v6.mp4
          ffprobe -v error -of json -show_streams -show_format tivvlejoy-scenery-showcase-30s-v6.mp4 > ffprobe.json
          python3 - <<'PY'
          import json, os, fractions
          p=json.load(open('ffprobe.json')); v=next(s for s in p['streams'] if s.get('codec_type')=='video')
          assert int(v['width']) == 1080 and int(v['height']) == 1920
          duration=float(p['format']['duration']); assert 29.8 <= duration <= 30.2
          fps=float(fractions.Fraction(v.get('avg_frame_rate') or v.get('r_frame_rate') or '0/1')); assert 29.8 <= fps <= 30.2
          size=os.path.getsize('tivvlejoy-scenery-showcase-30s-v6.mp4'); assert size > 100000
          print(json.dumps({'width':1080,'height':1920,'duration':duration,'fps':fps,'bytes':size}))
          PY

      - name: Upload finished real-scenery video
        uses: actions/upload-artifact@v4
        with:
          name: tivvlejoy-scenery-showcase-30s-real-assets-v6
          path: |
            tivvlejoy-scenery-showcase-30s-v6.mp4
            status.json
            ffprobe.json
            pod-status.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Always terminate exact V6 showcase pod
        if: always()
        shell: bash
        run: |
          set +e
          code=$(curl --retry 8 --retry-all-errors --retry-delay 3 --max-time 90 -sS -o cleanup.json -w '%{http_code}' \
            --request POST "$BRIDGE_URL" \
            --header 'content-type: application/json' \
            --header "x-tivvlejoy-scenery-authorization: $SCENERY_AUTHORIZATION" \
            --header "x-tivvlejoy-runpod-key: $RUNPOD_API_KEY" \
            --data '{"action":"cleanup"}')
          python3 - <<'PY'
          import json
          try: p=json.load(open('cleanup.json'))
          except Exception: p={}
          safe={'matchedBefore':p.get('matchedBefore'),'terminatedCount':p.get('terminatedCount'),'remainingActiveExactName':p.get('remainingActiveExactName'),'billingCleanupConfirmed':p.get('billingCleanupConfirmed'),'createPerformed':p.get('createPerformed'),'error':p.get('error')}
          print(json.dumps(safe))
          assert p.get('billingCleanupConfirmed') is True
          assert int(p.get('remainingActiveExactName') or 0) == 0
          assert p.get('createPerformed') is False
          PY
          test "$code" = '200'
